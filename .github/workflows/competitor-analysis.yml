name: 유심사 경쟁사 주간 분석 (비활성 - Render로 이전)

# [비활성] Render Cron Job으로 이전됨 (render.yaml 참조)
# 필요 시 workflow_dispatch로 수동 실행은 가능합니다.
on:
  # schedule:
  #   - cron: '30 0 * * 1'
  workflow_dispatch:  # 수동 실행만 가능

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run competitor analysis
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/main.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: competitor-report-${{ github.run_number }}
          path: |
            reports/*.md
            reports/*.html
          retention-days: 90

      # [비활성] Render 환경에서는 git push 불필요 (Slack 전송으로 대체)
